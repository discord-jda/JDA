org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.jvmargs=-Xmx1G "-XX:MaxMetaspaceSize=512m"
org.gradle.parallel=true
# The Kotlin plugin otherwise adds kotlin-stdlib as an implicit implementation dependency. That is
# unwanted here because it would appear in the published POM for every consumer without review.
# The stdlib is now a deliberate `api` dependency in build.gradle.kts, added when the first Kotlin
# type landed on the public API; keep this flag off so the two do not fight.
kotlin.stdlib.default.dependency=false
